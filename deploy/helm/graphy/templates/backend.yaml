{{- $fullname := include "graphy.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels: {{- include "graphy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "graphy.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "graphy.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values.config | sha256sum }}
    spec:
      {{- include "graphy.podSpec" (dict "root" .) | nindent 6 }}
      containers:
        - name: api
          {{- include "graphy.backendContainer" (dict "root" .) | nindent 10 }}
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  labels: {{- include "graphy.labels" . | nindent 4 }}
spec:
  selector: {{- include "graphy.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- if .Values.migrations.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-migrate-{{ .Release.Revision }}
  labels: {{- include "graphy.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      {{- include "graphy.podSpec" (dict "root" . "hook" true) | nindent 6 }}
      restartPolicy: Never
      containers:
        - name: migrate
          {{- include "graphy.backendContainer" (dict "root" .) | nindent 10 }}
          command: ["python", "-m", "graphy.scripts.init_db"]
{{- end }}
