# Lint, type-check and test on every pull request; build images on main (TRD 11, CI/CD).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run pytest -q

  backend-integration:
    # Migrations and the Neo4j schema against real databases (TRD 11, Integration).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: graphy
          POSTGRES_USER: graphy
          POSTGRES_PASSWORD: graphy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U graphy" --health-interval 5s --health-retries 20
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/graphy-dev-password
        ports: ["7687:7687"]
    defaults:
      run:
        working-directory: backend
    env:
      GRAPHY_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Migrate and apply graph schema
        run: uv run python -m graphy.scripts.init_db
      - name: Load synthetic data and resolve
        run: uv run python -m graphy.scripts.seed_demo --people 200 --rings 3
      - name: Graph queries against the seeded database
        env:
          GRAPHY_INTEGRATION: "1"
        run: uv run pytest tests/integration -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/graphy
      - run: helm template ci deploy/helm/graphy > /dev/null

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/graphy-${{ matrix.component == 'frontend' && 'web' || 'backend' }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
